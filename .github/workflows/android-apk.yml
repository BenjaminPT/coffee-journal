name: Build Android APK
# Запуск: вкладка Actions → "Build Android APK" → Run workflow.
# Готовый coffee-journal.apk появится в Artifacts (а при теге v* ещё и в Releases).
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web assets (Motion is bundled locally for full offline use)
        run: |
          mkdir -p www
          cp -r index.html styles.css sw.js manifest.webmanifest js icons www/
          npm init -y >/dev/null
          npm i motion@11.18.2 --no-audit --no-fund
          if [ -f node_modules/motion/dist/motion.js ]; then
            cp node_modules/motion/dist/motion.js www/js/motion.umd.js
            sed -i 's#https://cdn.jsdelivr.net/npm/motion@11.18.2/dist/motion.js#js/motion.umd.js#' www/index.html
          fi

      - name: Create Capacitor Android project
        run: |
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --no-audit --no-fund
          npx cap init "Кофейный журнал" com.cafejournal.app --web-dir www
          npx cap add android

      - name: App icon
        run: |
          for s in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $s
            d=android/app/src/main/res/mipmap-$1
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert icons/icon-512.png -resize $2x$2 "$d/$n.png"
            done
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Build debug APK (installable, signed with the debug key)
        run: |
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../coffee-journal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: coffee-journal-apk
          path: coffee-journal.apk

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: coffee-journal.apk
